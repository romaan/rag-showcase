[project]
name = "rag-showcase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",

  # LangChain (orchestration + tools + text splitters)
  "langchain>=0.2.14",
  "langchain-community>=0.2.12",
  "langchain-openai>=0.1.19",
  "langchain-ollama>=0.1.0",
  "langchain-text-splitters>=0.0.1",

  # Optional loaders
  "pypdf>=4.2.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[tool.poetry]
name = "rag-showcase"
version = "0.1.0"
description = "RAG Showcase (FastAPI + pgvector + Ollama)"
authors = ["Romaan <romaank@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
